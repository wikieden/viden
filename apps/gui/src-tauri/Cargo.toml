[package]
name = "viden-gui"
version = "0.1.0-rc.3"
edition = "2024"
license = "MIT"

[lib]
name = "viden_gui"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "viden-gui"
path = "src/main.rs"

[[test]]
name = "architecture_boundary"
path = "../tests/architecture_boundary.rs"

[[test]]
name = "fixture_parity"
path = "../tests/fixture_parity.rs"

[[test]]
name = "native_acp_fixture"
path = "../tests/native_acp_fixture.rs"

[[test]]
name = "d11_intake"
path = "../tests/d11_intake.rs"

[[test]]
name = "d4_lane_create"
path = "../tests/d4_lane_create.rs"

[[test]]
name = "d1_cockpit"
path = "../tests/d1_cockpit.rs"

[[test]]
name = "composer_controls"
path = "../tests/composer_controls.rs"

[[test]]
name = "statusbar_projection"
path = "../tests/statusbar_projection.rs"

[[test]]
name = "topbar_source_projection"
path = "../tests/topbar_source_projection.rs"

[[test]]
