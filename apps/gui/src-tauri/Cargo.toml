[[test]]
name = "d2_decisions"
path = "../tests/d2_decisions.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Used to read the canonical serde tag of a Core event kind instead of
# duplicating Core's 117-variant vocabulary in the client.
serde_json = "1"
sha2 = "0.10"
# A webview cannot load a workspace path, so persisted Agent content is handed
# to the frontend as an inline data URL.
base64 = "0.22"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
viden-core = { path = "../../../crates/core" }

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
serde_json = "1"
toml = "0.8"

