[evidence]
# Deliberately still the rc.3 tree. rc.4 added DiffReview and EvidenceView,
# rc.5 the navigation shell, the cockpit centre, the context dock tabs, the
# in-cockpit secondary views, and the 0.3.4 Core consumers, and rc.6 Plan
# Studio (D15), the Agent Board (D16), the Always/Edit dock and the D4 agent
# binding; every one of those has deterministic captures under
# `apps/gui/evidence/` per surface rather than per version, and rc.6's
# design-fidelity record is `apps/gui/evidence/fidelity-gate/` (G10). No
# `0.1.0-rc.4`, `0.1.0-rc.5` or `0.1.0-rc.6` acceptance tree was produced by
# any of those checkpoints, and naming one that does not exist would be worse
# than naming the one that does.
root = "apps/gui/evidence/0.1.0-rc.3"
matrix_tests = "apps/gui/tests/visual"
