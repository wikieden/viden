[runtime_trust_loop]
command_count = 8
events = ["handoff_updated", "review_request_updated", "contract_updated", "dependency_updated", "merge_conflict_bounced", "revert_recorded", "merge_gate_updated"]
review_decision = "decide_review records the independent reviewer lane verdict; the requester lane is never accepted as decider and a rejected review blocks accept_merge_gate"
decision_compatibility = "schema-1 legacy string decisions deserialize as read-only legacy facts; new writes are typed"
evidence_boundary = "canonical evidence is required for acceptance; summary-only evidence never satisfies a merge gate"

[runtime_workspace_files]
commands = ["query_workspace_files"]
events = ["workspace_files_loaded"]
boundary = "permission-gated read: Core consults the permission engine under the non-mutating `workspace_file_inventory` tool with the workspace root as the input path before it reads a single directory entry; a deny, and an unresolved ask, both come back as `command_rejected` naming this exact read and the refusal, never an empty page and never a bare error event (which carries no command id and would let a client mistake an unrelated failure for its own refusal), while plan mode still answers through the engine's SafeRead branch because the tool mutates nothing"
exclusions = "gitignore-aware walk (honored outside a Git repository, without global or parent ignore files so the same workspace enumerates identically on two machines) plus unconditional removal of `.git/`, `.viden/`, `.omx/`, `.worktrees/`, and `.ref/`, which hold runtime and agent state rather than workspace content"
ordering = "entries are sorted lexicographically before the prefix filter, the exclusive `after` cursor, and the limit clamp of 1..=500, so `complete` and `next_after` describe the filtered ordered inventory; a prefix that leaves the workspace is rejected rather than clamped or answered with an empty page"
correlation = "workspace_files_loaded carries the command id of the query it answers as a required field, so unlike audit_page_loaded there is no uncorrelated page and a client never falls back to attributing a page to its own acceptance"

[runtime_structured_diff]
commands = ["query_workspace_diff"]
events = ["workspace_diff_loaded"]
facts = ["approval_request_view.decision_context", "workspace_change_view.diff"]
boundary = "Core is the only producer of diff rows: the unified-diff parser that applies patches (`crates/tools/src/patch.rs`) is promoted to emit `DiffDocument`, so a hunk means the same thing to the apply path and to every client, and no frontend parses diff text itself"
gate = "the read is permission-gated under the existing non-mutating `git_diff` tool with the resolved target root as the input path, so one viden.toml rule set governs an operator's review pane and an agent's `git_diff` call; a deny, and an unresolved ask, both come back as `command_rejected` naming this exact read with the hint folded into the reason, never an empty page (which reads as `nothing changed`) and never a bare error (which carries no command id); plan mode still answers through the engine's SafeRead branch because the tool mutates nothing"
target = "reads name the workspace or one Lane, never a path; Core resolves a Lane's worktree from its own records and rejects an unknown, archived, or cancelled Lane rather than answering from the workspace root"
bounds = "`byte_limit` is clamped to 1..=1048576 with a 256 KiB default; the bound drops rows, never entries or counts, and sets `omitted` per file and `truncated` on the document and the page, so `not shown` is always distinguishable from `unchanged`"
decision_context = "produced for `edit_file` and `write_file` by reading the target file read-only and computing the proposed content in memory — no mutation happens at approval time — and for the trust loop's `merge_agent_patch` from the canonical patch bytes it already holds; `base_sha256` names the bytes a single-file preview was computed against and is absent for a multi-file patch and for a file Core could not read"
limitation = "the preview is computed at approval time and execution runs the proposed tool input, so a file changed in between can produce a different result; `base_sha256` lets a client or an audit reader detect that afterwards, and a pre-execution recheck is not in 0.3.3"
scope = "`both` gives a path changed on both sides its worktree rows, because that is the content the operator's file holds; the staged half stays visible through the entry's `index` classification"

[runtime_operator_git]
commands = ["run_operator_git_action"]
events = ["operator_git_action_finished", "workspace_source_updated"]
actions = ["stage", "unstage", "commit", "push", "fetch"]
mapping = "each action resolves to exactly one existing agent tool spec — stage to `git_add`, unstage to `git_restore` with staged=true and worktree=false, commit to `git_commit`, push to `git_push`, fetch to the new mutating `git_fetch` — and runs through the same tool registry, so one viden.toml allow/ask/deny rule set governs an operator's commit bar and an agent's git call, and there is exactly one git implementation"
gate = "validate, then `PermissionEngine::decide` on the mapped spec before any process spawns; a malformed action, a path that leaves the target, an unknown or archived lane, plan mode, a deny rule, and a denied approval all come back as `command_rejected` naming this exact command with the hint folded into the reason"
approval = "an ask routes through the owner-scoped supervisor queue with `target.kind = \"git\"` and risk ranked by reversibility — high for push, medium for commit, low for stage, unstage, and fetch — and a commit carries a decision context holding the staged diff, which is exactly the content the commit will contain"
audit = "the authorization record is appended before the effect and fail-closed under `AuditObjectRef` kind `source` (plus the lane ref for a lane target) with action key `source.<verb>`; the append-only log cannot amend it, so the result arrives as a completion record naming the authorization through `attempt`, and the finished event carries the authorization id"
failure = "a failure after a granted permission is an `operator_git_action_finished` carrying a `failed` outcome, never a `command_rejected`, because the effect was attempted and the attempt is audited; Core classifies git's stderr in one function into nothing_to_commit, non_fast_forward, authentication_required, remote_unreachable, no_upstream, path_outside_repository, or other, and clients never parse output text"
upstream = "a push with set_upstream=false on a branch with no upstream is refused as `failed { no_upstream }` rather than run, because `git push <remote> <branch>` would create an untracked remote branch after which ahead/behind is unknowable and the source chip would read `in sync` forever"
bounds = "git output is bounded to 8192 bytes with a `truncated` flag; a commit message is required, non-empty, and at most 4096 bytes"
exclusions = "pull, merge, and rebase move HEAD and can create conflicts that belong to the lane conflict machinery; commit --amend, reset, force push, and branch delete rewrite history with no affordance in the registered DiffReview and no undo story; switch and checkout would invalidate a bound lane's owner binding, which Core owns through the starter lane path; stash is not in the design"
state = "the finished event is a settled answer to one command and is never folded into `RuntimeViewState`; the `workspace_source_updated` that follows it carries the resampled source and is reduced as it always was"

[runtime_conflict_content]
events = ["merge_conflict_bounced", "lane_conflict_detected"]
attach_sites = "a `ConflictBounce` raised by a failed `merge_agent_patch`, and the `LaneConflictDetected` a refused `apply_lane_changes` publishes, which the reducer copies onto `LaneConflictView`; no new event type exists, both existing events gained one optional field, and a payload written before this capability deserializes to `None` rather than failing the stream"
producer = "one function in `viden_tools::patch` re-runs the same strict apply read-only after it refused, so the reason a client renders is the reason the apply saw; `theirs` is the incoming hunk's new side at its `new_start`, `base` is that hunk's own preimage, and `ours` is a read-only read of the target at the hunk's declared old range, clamped to the file"
baseline = "`Evidence { bindings }` whenever the merge gate holds canonical reviewed evidence, because that is what the reviewer accepted and what the apply was authorised against; `Revision { sha }` for the Lane apply path and for a gate whose bindings no longer validate, naming the commit the `ours` side was read at; `Unknown` when Core held no baseline it could name, which is a real answer a client must render as unknown rather than silently as HEAD"
not_a_merge = "this is two sides plus the patch preimage and nothing else — Core computes no merge base and resolves nothing, so a client must not present it as a three-way merge or offer to auto-resolve it"
honesty = "only hunks the apply actually rejected are listed; a hunk after the refusal was never attempted, a patch the scanner could not parse and a refusal with no hunk shape produce no content at all, and an operator `bounce_merge_conflict` carries `None` because a human judgement has no apply failure behind it — `None` means Core has nothing to show, never that the conflict was empty"
reasons = "context_mismatch, already_applied when the file already holds the hunk's new side, file_missing, file_deleted when a deletion's preimage would leave the file behind, and binary, which the local apply cannot produce because a binary file carries no rows to reject"
bounds = "256 KiB across the published lines; a file over the bound keeps its entry with `omitted` set and no hunks, and the content sets `truncated`, so `not shown` stays distinguishable from `no conflict here`"

[runtime_evidence_reads]
commands = ["query_evidence", "read_evidence_content"]
events = ["evidence_page_loaded", "evidence_content_loaded"]
source = "the durable evidence archive Core rebuilds at open from the append-only workflow agent log (`runtime_projection` / `runtime_projection_batch` rows carrying `evidence_recorded`), never `RuntimeViewState.latest_evidence`, which is a client-side reduction of whatever stream that client received and carries no ordering, no cursor, and no content"
ordering = "ascending on `(timestamp, id)` where timestamp is `EvidenceView.timestamp`; a row Core never dated sorts first, before every dated row, because undated is the oldest thing Core can honestly say about it and a forward-paging client must meet it once at the start rather than after rows it already rendered as newer"
cursor = "opaque: `next_after` is a string a client passes back verbatim as `after`, and clients must not parse, construct, or compare it; it is tagged so the undated position stays distinct from `timestamp = 0`, and an id containing the separator still round-trips"
scope = "`owner` is a prefix scope match over `RuntimeOwner` that fails closed on both sides — a query naming a task is not satisfied by a row that only knows its lane, and a row with no recorded owner never satisfies a scoped read, because answering one with it would turn `Core did not know` into `this lane produced it`; empty `kinds` means every kind, never nothing"
filtering = "every filter is applied before the page is cut, so `complete` and `next_after` describe the filtered archive; a client filtering a page it already holds cannot see a matching row on a page it never loaded, so its `no patch evidence for this lane` would be a completeness claim it has no evidence for"
gate = "the same posture as `query_audit` and deliberately not `query_workspace_files`: bounded and owner-scoped, never tool-gated, because the evidence archive is Viden's own state rather than the operator's tree — there is no workspace read to authorize and no `git_*` or file tool whose viden.toml rule would describe one, so gating it on a tool spec would invent a permission with no meaning and let a rule written about the filesystem hide facts Core already holds; it mutates nothing and prompts for nothing, so it stays answerable in plan mode"
content = "read only from the canonical ContextStore bytes named by `EvidenceView.canonical` and only after they verify against that reference's `source_hash`; no canonical reference answers `unavailable { summary_only }`, an unopenable store or a missing blob or handle answers `unavailable { missing_canonical_bytes }`, bytes that fail their own hash answer `unavailable { hash_mismatch }` and are never served, verified non-UTF-8 bytes answer `unavailable { binary }`, kind `patch` answers `diff` through the same `parse_diff_document` the structured diff capability uses, and everything else answers bounded `text`"
never_unverified = "there is no variant for bytes Core could not verify — content that fails its own hash is exactly the content a reviewer must not be shown as canonical, and `hash_mismatch` is kept apart from every other store failure because it is the opposite fact: the bytes are present and are the wrong ones"
refusals = "an over-limit `kinds` list, a cursor this build did not issue, and an evidence id never recorded are pre-answer refusals published as `command_rejected` carrying the caller's own command id, never an empty page a client would render as an empty archive; `limit` is clamped to 1..=200 rather than refused, as `audit_query` does, because a client that asked for too many rows still means something answerable"
bounds = "50 rows per page by default and at most 200, at most 32 `kinds` filters, and 256 KiB of content with `truncated` on the text path and the document's own `truncated` on the diff path"
state = "both answers are query results and neither is folded into `RuntimeViewState`; the view already carries `latest_evidence`, so folding an archive page in would let a paged read of old rows overwrite the live projection with no way for a client to tell the two apart"

[runtime_workspace_owner]
events = ["workspace_runtime_owner_bound", "lane_source_updated"]
minting = "`workspace_id` is `ws_` plus the first 16 lowercase hex characters of SHA-256 over the canonical root path, so the same directory always mints the same id with no store to consult and moving the repository changes it — the id names a location, and that is stated rather than hidden; `project_id` is read from `.viden/project.toml` `[project] id` and minted there as `prj_<token>` on the first open, because that is the half an audit trail joins on and the half that must survive a move"
origin = "`project_id_origin` separates `existing` from `minted`, so an operator meeting a new project id in an audit trail can tell which of the two happened without diffing a file Core owns; an id already in the file is never rewritten, since a second minted id would split one project's history into two identities with nothing to join them on"
scope = "a workspace owner carries `workspace_id` and `project_id` and nothing else — `lane_id`, `session_id`, `task_id`, and `turn_id` are all absent — and a binding that carries any of them is refused by the producer and ignored by the reducer rather than trimmed, because a trimmed one would make a Lane's identity the actor every workspace-target mutation is audited under"
publication = "emitted once per open as the first fact after `snapshot_updated`, so a snapshot replay carries it; absence is a real answer meaning this Core published no workspace identity, and a client gates its workspace-target commit bar on presence rather than substituting an empty owner"
inheritance = "a new binding starts from the workspace identity: the supervisor folds the two ids into an envelope owner that carries neither, once, so a Lane created after open carries them in its binding; an owner a client did name is never rewritten, and a command carrying its own actor is skipped because the supervisor validates actor against envelope owner and stamping one side would launder a mismatch past that check"
operator_git = "a `run_operator_git_action` with `target = workspace` is accepted when its owner names the published workspace and refused before any process spawns when it names none or names another workspace; the refusal is a `command_rejected` quoting GUI-CORE-027 so an operator learns which capability their client is missing rather than only that they were refused, and the audit record the action appends names that owner rather than nobody"
lane_source = "`lane_source_updated` carries one Lane worktree's own source facts, sampled wherever the workspace source is sampled (connect, snapshot, and every completed supervised command) and again after an operator git action targeting that Lane; `workspace_source_updated` keeps its meaning — the workspace root only — so a Lane action no longer puts one tree's branch and ahead/behind into another tree's chip"
no_row = "a Lane with no worktree of its own is a direct-workspace Lane whose source *is* the workspace source, so it has no row rather than a duplicate one, and a terminal Lane has none either because its worktree may already be gone and sampling a missing directory would publish `unavailable` for a Lane that simply finished; an empty map means Core sampled no Lane, never that every Lane is clean"
state = "`workspace_owner` and `lane_sources` are optional view fields skipped when absent, so a view that never saw either fact serializes to exactly the bytes it did before and the nine frozen base fixtures do not move"

[ui_layout_preferences]
commands = ["set_ui_layout_preferences", "reset_ui_layout_preferences"]
events = ["ui_layout_preferences_updated"]
separate_record = "a separate record and capability rather than a `UiPreferences` field, because `ResolvedUiPreferences` serializes into every `RuntimeSnapshot`: one more field there would move the recorded digest of all nine frozen base fixtures, while an optional view field skipped when absent moves none"
persistence = "the `[ui.layout]` table beside `[ui]` in the same user config file, written through the same atomic temp-then-rename path the appearance profile uses; resetting the appearance profile deliberately carries `[ui.layout]` across, because the two records answer two different commands and an operator resetting a theme must not find their cockpit rearranged"
not_persisted = "a record Core applied but could not write is published with `persisted = false` and the reason as a diagnostic rather than dropped or reported as saved, mirroring `ui.preference_persistence`; the record still governs the session, because refusing to apply it over a read-only disk would be the worse answer"
vocabulary = "`hidden_statusbar_segments` names are kept verbatim, including ones this Core does not recognize, because the statusbar vocabulary belongs to the client and a Core that stored only the names it knew would quietly unhide everything a newer client hid; identity and actionable segments are never listed, since a client must not offer to hide what tells an operator who they are or what needs a decision"
bounds = "at most 16 hidden segments and 64 bytes per name, refused rather than clamped: a clamped list silently keeps showing a segment the operator asked to hide and nothing on the stream would say so; an empty name and a control character are refused for the same reason a segment name is not free text"
gate = "no permission prompt: the record grants nothing and arranges one client's own window, and prompting an operator to approve their own layout would train them to click through the prompts that matter; a refusal is always pre-write and is answered as a `command_rejected` naming the caller's command"
patch = "`None` on a patch field means leave it, never reset it — a reset is its own command — so a client changing only the sidebar cannot accidentally unhide every segment the operator hid"
defaults = "`floating` is the default, per design decision D-SIDEBAR (hover peek, horizontal space to the transcript), with `pinned` the alternative that takes a layout column; a record Core never published is absent rather than defaulted, so a client can tell `Core has no layout preference for you` from `Core says floating`"

[runtime_turn_lifecycle]
events = ["turn_started", "turn_finished"]
bracket = "every turn — the native composer turn, a drained queue entry, and an Agent session run — opens with `turn_started` and closes with `turn_finished` on every exit, so liveness is a fact a client reads from `active_turns` rather than a guess from display residue; before this capability a built-in turn published no terminal fact at all and both clients inferred one from leftover assistant text"
outcome = "`completed`, `failed { reason }`, and `cancelled` are three different ends and only the first drains the queue behind the turn, so a client that collapsed them would tell an operator a queued prompt is about to run when Core has already decided it is not; an unmodeled future outcome must be read as `ended, cause unknown` rather than as success"
source = "`user_input`, `queued_input { input_id }`, and `agent_session { session_id }` — the middle one exists because a drained turn puts text in the transcript that nobody typed just now, and without the source that reads as Core inventing work; `input_id` is the exact id `input_queued` and `input_dequeued` carry"
settlement = "`turn_finished` on an owner with no lane clears the unscoped `assistant_stream`, the same settlement a terminal Agent-session fact has performed since the 2026-09-07 lifecycle fix, now reaching the path that never had one; a Lane-scoped turn deliberately leaves it alone, because a Lane's reply lives in the owner-scoped conversation and clearing the unscoped stream on it would wipe a session-scoped reply still being produced beside it"
drain = "a completed session-scoped turn pops the oldest queued follow-up, announces it with `input_dequeued` before starting anything, and runs it as its own bracketed turn, repeating until the queue is empty or a turn does not complete; a drained turn is a turn in every other respect — it acquires its own active job so `cancel_active_turn` stops it, and it prompts through the same approver so an operator answers its approval exactly as they would a typed turn's — but it announces no `command_accepted`, because no client sent a command for it"
kept = "a failed or cancelled turn keeps the queue and the snapshot prefix re-lists it, so an operator sees what is waiting rather than discovering it was silently discarded or silently run; the Lane worker's own queue is untouched, since `queued_runtime_inputs` is the built-in engine's"
armed = "the drain is armed by a completed session-scoped turn rather than fired only at the instant of completion: the supervisor is one worker, so a follow-up queued *while* a turn runs is still in its channel when that turn ends, and a follow-up that lands while the drain is armed therefore runs as soon as it is queued; a turn that does not complete disarms it, which is the rule that matters"
owner = "the turn owner is the command's own scope plus a fresh `turn_id` — a Lane's native turn stays the Lane's, or a Lane composer would never see its own work — so a client matches its composer on the scope it already knows and ignores `turn_id`, which is there for an audit row to join on"
crash_safety = "a turn is never resumed across a restart and leaves no durable trace: neither fact is written to the session JSONL or to the ACP runtime-event log that snapshot assembly replays, because a persisted `turn_started` whose process died before its `turn_finished` would rebuild as a turn that is still running — a phantom Core cannot cancel and a client cannot clear; a reconnecting client sees only the turns Core is running now and a queue it can inspect"
state = "`active_turns` is skipped when empty, so a view that never saw a turn serializes to exactly the bytes it did before and the nine frozen base fixtures do not move"

[runtime_workspace_file_reads]
commands = ["read_workspace_file"]
events = ["workspace_file_loaded"]
purpose = "the inventory beside this one says a path exists; this says what is in it, so the cockpit's Files and Code tabs and the palette's file rows render Core facts instead of the client opening the operator's files itself, which is outside the client boundary and past the permission gate every other path read goes through"
target = "`source_target` names the workspace root or one Lane worktree and Core resolves the Lane's path from its own records; a client never passes one, and an unknown, archived, or cancelled Lane is refused rather than silently read from the workspace root, which would serve one tree's file under another tree's identity"
path = "target-relative and `/`-separated, refused rather than repaired: empty, absolute, drive-prefixed, backslashed, `..`-bearing, control-character-bearing, and file-less (`.`) paths are all `command_rejected`, because normalizing `../../etc/passwd` into `etc/passwd` would serve a different file than the one asked for under the asked-for name and answering `not_found` would claim the operator's own tree lacks a file that may well exist"
containment = "the validated relative path and the resolved target root are the entire scope — `read_file`'s own `resolve_path` scopes nothing and will join an absolute path as given — so the root and the target are canonicalized independently and compared before a byte is read; a symlink at the leaf or at any parent that resolves outside the root is `unavailable { unreadable }` rather than followed, while a link that stays inside resolves normally"
gate = "the real `read_file` `ToolSpec` taken from the live registry, never one retyped on this path, with the resolved absolute path as the input `path`, so one viden.toml allow/ask/deny rule set governs an operator opening a file and an agent reading the same bytes; a deny and an unresolved ask are both `command_rejected` naming `read_file` with the grant hint folded into the reason, the approver is never consulted because this read answers a keystroke rather than an interactive turn, and plan mode still answers because `read_file` mutates nothing"
body = "`binary` when the leading 8 KiB hold a NUL or the published prefix does not decode as UTF-8 — replacement characters on the wire are content a client cannot tell from content the file holds — and `binary` carries no payload at all; `text` otherwise, cut at the clamped bound on a character boundary, because a prefix the bound split mid-character falls back to the last complete character rather than being published lossily"
truncated = "says the bound cut the file, never that the file was short: a bound equal to the file's length is not truncated, and the same incomplete trailing sequence at the end of a file nothing cut is simply not UTF-8 and answers `binary`"
identity = "`size` is the file's real length and `sha256` is over the whole file rather than the published prefix, which is what lets a client tell a truncated view of one revision from a full view of another; the read streams the file in chunks so hashing past its own bound costs no memory"
absence = "a missing path, a directory, and an unreadable file are typed `unavailable` answers on a published event rather than refusals, because they are facts about the tree a client renders rather than retries, and their `size` and `sha256` are absent rather than `0` and `\"\"`, which a client would render as a real empty file with a real digest; only a malformed request, an unresolvable Lane, and a permission decision are `command_rejected`"
bounds = "256 KiB per read by default and 1 MiB at most, clamped rather than refused because a caller asking for too many bytes still means something answerable"
state = "the answer is a query result and is never folded into `RuntimeViewState`; storing bytes there would keep an arbitrary blob alive in every snapshot after it for content rendered once and that the tree can change underneath, so publishing one moves no snapshot digest and no frozen base fixture"
[runtime_durable_work_evidence]
events = ["evidence_recorded", "evidence_canonicalized", "audit_page_loaded"]
adds = "no type and no event: what changes is which facts reach the durable archive and the audit log, which is why it is still capability-gated — a client that pages the evidence archive after an applied edit has to know whether this Core writes one at all, because before it an empty page and `this session changed nothing` were the same answer"
native_patch = "an applied `write_file`/`edit_file` publishes an `evidence_recorded` of kind `patch`, id `patch-<tool_call_id>`, owned by the turn, beside the live `workspace_change_updated` that describes the same change; the cockpit fact comes first, because a reviewable artifact must never arrive before the change it belongs to"
canonical = "the row's bytes are the unified diff the tool itself produced, stored in the canonical ContextStore and re-read and re-hashed before the row claims `verified`, so `source_hash` names content `read_evidence_content` can serve and verify rather than a summary of content nobody kept; the 64 KiB cockpit patch bound does not apply, because that bound keeps a live event small while the archive's job is to hold the whole change a reviewer has to read"
absent_bytes = "a diff over `MAX_EVIDENCE_CONTENT_BYTES`, or a store that refuses the write, still publishes the row — `this turn changed that file` is worth archiving either way — with `canonical: null` and a summary naming which of the two happened; a silently dropped canonical reference would be indistinguishable from display-only evidence, which the merge gate treats differently"
producer = "`identity: native` for a built-in turn and `agent` for an adapter-reported patch, `role: coder`, and `task_id` = the owner's task when the turn is bound to one, else the turn, else the tool call; that one rule is the merge-gate contract — a gate accepts a `patch` row only when its producer names the gate's own task, so a Lane's turn satisfies its Lane's gate while a session-scoped composer edit, which names a turn and never a task, is refused with `missing_producer` and the gate says so"
permission_snapshot = "the audit id of the approval that actually allowed this tool call, and `null` otherwise; the receipt is consumed per completed tool call rather than read, because an `allow_session` or `allow_repo` scope lets later calls run unprompted and a receipt left behind would attach the first approval's id to every mutation after it — naming a receipt that does not exist would let a merge gate accept a mutation nobody approved"
agent_patch = "`viden-agents` is a leaf below the runtime with no ContextStore, so it reports a patch with `canonical: null` and the diff inside the fact's `metadata`; the runtime's ingestion stores those bytes and publishes `evidence_canonicalized` immediately after the row it completes rather than at the end of the batch, so a client never holds an announcement for a row it has not seen; the producer task is read from the `merge_gate_updated` the same batch carries, and a batch Core cannot attribute is left uncanonicalized rather than stored under an invented task"
durability = "the supervisor hands every terminal native turn batch to `SessionEngine::absorb_supervised_events`, which is the wiring that has never existed: only the direct command path persisted its domain facts, so every fact a supervised turn produced — the whole path a cockpit uses — was live-only and the archive rebuilt at open was empty after a session that had genuinely changed files; a failed turn's completed tool facts are handed over too, since an archive that dropped them would tell a reviewer the files were never touched"
live_only = "`workspace_change_updated` and `check_run_updated` stay live-only and `evidence_recorded`/`evidence_canonicalized` become durable, decided by `is_durable_runtime_domain_event` rather than by the new caller, so the supervised path and the command path archive exactly the same set; the two live facts are a cockpit's view of the working tree, re-sampled at every connect, and persisting them would replay a stale tree as fact"
approval_audit = "`respond_to_approval` appends one audit record before the `approval_resolved` that announces it, under the pre-minted `audit_id` the request already showed the operator, as actor `operator`, action `approval.<allow_once|allow_session|allow_repo|deny>`, scope as an argument, and objects naming the approval request, the tool, and the job the decision released; the id was published on two facts and written nowhere before this, which is what made every cockpit audit link for an approval resolve to nothing"
audit_failure = "fail-open on the decision and fail-loud on the audit: refusing to deliver an answer the operator has already given because a log append failed would leave a tool call blocked forever, so the append failure is published as an `error` instead of swallowed or turned into a refusal"

[runtime_transcript_rows]
commands = ["query_transcript_rows"]
events = ["transcript_rows_loaded"]
purpose = "the typed owner-scoped sibling of the frozen `runtime.transcript_page`, which is left exactly as it was: that command pages one session's storage log in persisted entry shapes and carries no owner, so a cockpit could not render an ordered user/assistant conversation for one Lane and GUI-CORE-009's `transcript_user` and `transcript_assistant` placeholders had nothing to resolve to"
source = "durable facts only — the append-only session transcript JSONL and the append-only audit timeline — and never `RuntimeViewState.agent_conversation`, which is a capped client-side reduction of whatever stream that client received and is empty after a restart; paging that would answer `what was said` with `what you happened to see`, which is the same fabricated absence from the other side"
attribution = "one transcript file holds more than one owner's work, because the supervised input path runs a Lane's native turn through the same engine as the session composer, so the turn driver writes the owner into the log itself as a `turn_owner` session-meta bracket opened by `begin_native_turn` and closed by `end_native_turn`; rows inside a bracket carry that owner verbatim, and a session-meta key is used because unknown keys are the one persisted shape every replayer already ignores rather than quarantines"
unattributed = "a row Core attributed to no turn carries only the session it is a line of, which is all Core knows and never enough to satisfy a Lane-scoped query; it is deliberately not an empty owner, which would answer a query naming any session"
scope = "`owner` is a prefix scope match over `RuntimeOwner` using the same matcher `evidence_query` applies, reused rather than reimplemented so both owner-scoped reads narrow identically; it fails closed both ways — a query naming a Lane is never answered by a row Core could not attribute to it, and a query naming a task is not satisfied by a row that only knows its Lane"
ordering = "row positions come from each source's own position rather than from a rank over the merged set — a transcript row at entry ordinal `o` gets `2 * o + 1` and an audit-derived permission row belonging after the first `a` entries gets `2 * a` — so an audit row landing with an old timestamp takes a position of its own instead of renumbering rows a client has already paged; `sequence` is an ordering key and not a count, so a gap is never a lost row"
cursor = "opaque: `older` is a string a client passes back verbatim as `before`, and clients must not parse, construct, or compare it; `before` is an exclusive upper bound so two adjacent pages tile without repeating the boundary row"
paging = "backwards from the newest end, because a transcript is read where it is newest and scrolled up, while a page itself reads oldest-first so a client appends it above what it already holds rather than reversing it; the owner scope is applied before the page is cut, so `complete` and `older` describe the scoped transcript rather than the raw log"
variants = "`user` and `assistant` prose, `tool_call` as the same `ToolCallView` the live stream carries, `tool_result`, `check_run` as the same `CheckRunView` derived by the same function the live cockpit fact uses, and `permission`; a check is its own row rather than a tool result wearing a label, so one shell command cannot be a check on the stream and a plain result in the transcript, and the assistant message that merely announces a tool call is not a row because the `tool_call` beside it already is"
permission_rows = "read from the durable approval audit rows rather than from the persisted permission log entry, which carries neither the approval request id nor the audit id a permission row must name; `decision` is absent for `allow_session` and `allow_repo` because the audit row keeps the scope key and not the session id or the path allow-list, and publishing `allow { once }` for either would misreport a standing grant as a one-shot one — `audit_id` is always present and is the row a client reads for the rest"
evidence = "a `tool_result` names C7's archived `patch` row for its exact tool call through one shared id helper, so the producer's spelling and the reader's cannot drift; an `assistant` body names an archived row whose canonical `source_hash` is that body's own digest, which is the only honest join available because nothing records an evidence row *for* an assistant message — the read never creates one, so an absent `evidence_id` means no canonical bytes exist rather than that they were withheld"
gate = "the same posture as `query_evidence` and deliberately not `read_workspace_file`: these are facts Core recorded into its own logs rather than bytes from the operator's tree, so there is no workspace read to authorize and no file or `git_*` tool whose viden.toml rule would describe one; bounded, owner-scoped, and paged instead, and answerable in plan mode because it mutates nothing"
refusals = "a cursor this build did not issue and a durable log Core could not read are pre-answer refusals published as `command_rejected` carrying the caller's own command id, never an empty page a client would render as a session in which nothing was said; `limit` is clamped to 1..=200 rather than refused, because a client that asked for too many rows still means something answerable"
bounds = "50 rows per page by default and at most 200, 8 KiB per row body with `truncated`, and 500-byte previews for a tool call's input and a tool result's summary — the same bound the live `tool_call_started` preview and the live `tool_result` evidence summary already use"
state = "the answer is a query result and is never folded into `RuntimeViewState`; folding a *scoped* page in would put one Lane's conversation into a view every client shares and let a scroll-up move the snapshot digest, so publishing one moves no snapshot digest and no frozen base fixture"
