[live_work_owner]
facts = ["agent_task_record", "tool_call_view", "queued_input_view", "evidence_view"]
boundary = "each live-work fact carries an optional full RuntimeOwner, populated only where the emitting site holds a real owner identity (Lane worker binding, published Agent session, merge gate, durable agent job); absence stays absent and is never a default owner or an owner inferred from timing, ordering, or label"
compatibility = "omitted when unknown, so a record with no owner encodes to exactly the bytes it did before the field existed and a producer predating the field deserializes to none"

