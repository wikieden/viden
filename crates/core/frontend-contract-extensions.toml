[runtime_trust_loop]
command_count = 8
events = ["handoff_updated", "review_request_updated", "contract_updated", "dependency_updated", "merge_conflict_bounced", "revert_recorded", "merge_gate_updated"]
review_decision = "decide_review records the independent reviewer lane verdict; the requester lane is never accepted as decider and a rejected review blocks accept_merge_gate"
decision_compatibility = "schema-1 legacy string decisions deserialize as read-only legacy facts; new writes are typed"
evidence_boundary = "canonical evidence is required for acceptance; summary-only evidence never satisfies a merge gate"

[runtime_workspace_files]
commands = ["query_workspace_files"]
events = ["workspace_files_loaded"]
boundary = "permission-gated read: Core consults the permission engine under the non-mutating `workspace_file_inventory` tool with the workspace root as the input path before it reads a single directory entry; a deny, and an unresolved ask, both come back as `command_rejected` naming this exact read and the refusal, never an empty page and never a bare error event (which carries no command id and would let a client mistake an unrelated failure for its own refusal), while plan mode still answers through the engine's SafeRead branch because the tool mutates nothing"
exclusions = "gitignore-aware walk (honored outside a Git repository, without global or parent ignore files so the same workspace enumerates identically on two machines) plus unconditional removal of `.git/`, `.viden/`, `.omx/`, `.worktrees/`, and `.ref/`, which hold runtime and agent state rather than workspace content"
ordering = "entries are sorted lexicographically before the prefix filter, the exclusive `after` cursor, and the limit clamp of 1..=500, so `complete` and `next_after` describe the filtered ordered inventory; a prefix that leaves the workspace is rejected rather than clamped or answered with an empty page"
correlation = "workspace_files_loaded carries the command id of the query it answers as a required field, so unlike audit_page_loaded there is no uncorrelated page and a client never falls back to attributing a page to its own acceptance"

[runtime_structured_diff]
commands = ["query_workspace_diff"]
events = ["workspace_diff_loaded"]
facts = ["approval_request_view.decision_context", "workspace_change_view.diff"]
boundary = "Core is the only producer of diff rows: the unified-diff parser that applies patches (`crates/tools/src/patch.rs`) is promoted to emit `DiffDocument`, so a hunk means the same thing to the apply path and to every client, and no frontend parses diff text itself"
gate = "the read is permission-gated under the existing non-mutating `git_diff` tool with the resolved target root as the input path, so one viden.toml rule set governs an operator's review pane and an agent's `git_diff` call; a deny, and an unresolved ask, both come back as `command_rejected` naming this exact read with the hint folded into the reason, never an empty page (which reads as `nothing changed`) and never a bare error (which carries no command id); plan mode still answers through the engine's SafeRead branch because the tool mutates nothing"
target = "reads name the workspace or one Lane, never a path; Core resolves a Lane's worktree from its own records and rejects an unknown, archived, or cancelled Lane rather than answering from the workspace root"
bounds = "`byte_limit` is clamped to 1..=1048576 with a 256 KiB default; the bound drops rows, never entries or counts, and sets `omitted` per file and `truncated` on the document and the page, so `not shown` is always distinguishable from `unchanged`"
decision_context = "produced for `edit_file` and `write_file` by reading the target file read-only and computing the proposed content in memory — no mutation happens at approval time — and for the trust loop's `merge_agent_patch` from the canonical patch bytes it already holds; `base_sha256` names the bytes a single-file preview was computed against and is absent for a multi-file patch and for a file Core could not read"
limitation = "the preview is computed at approval time and execution runs the proposed tool input, so a file changed in between can produce a different result; `base_sha256` lets a client or an audit reader detect that afterwards, and a pre-execution recheck is not in 0.3.3"
scope = "`both` gives a path changed on both sides its worktree rows, because that is the content the operator's file holds; the staged half stays visible through the entry's `index` classification"

[runtime_operator_git]
commands = ["run_operator_git_action"]
events = ["operator_git_action_finished", "workspace_source_updated"]
actions = ["stage", "unstage", "commit", "push", "fetch"]
mapping = "each action resolves to exactly one existing agent tool spec — stage to `git_add`, unstage to `git_restore` with staged=true and worktree=false, commit to `git_commit`, push to `git_push`, fetch to the new mutating `git_fetch` — and runs through the same tool registry, so one viden.toml allow/ask/deny rule set governs an operator's commit bar and an agent's git call, and there is exactly one git implementation"
gate = "validate, then `PermissionEngine::decide` on the mapped spec before any process spawns; a malformed action, a path that leaves the target, an unknown or archived lane, plan mode, a deny rule, and a denied approval all come back as `command_rejected` naming this exact command with the hint folded into the reason"
approval = "an ask routes through the owner-scoped supervisor queue with `target.kind = \"git\"` and risk ranked by reversibility — high for push, medium for commit, low for stage, unstage, and fetch — and a commit carries a decision context holding the staged diff, which is exactly the content the commit will contain"
audit = "the authorization record is appended before the effect and fail-closed under `AuditObjectRef` kind `source` (plus the lane ref for a lane target) with action key `source.<verb>`; the append-only log cannot amend it, so the result arrives as a completion record naming the authorization through `attempt`, and the finished event carries the authorization id"
failure = "a failure after a granted permission is an `operator_git_action_finished` carrying a `failed` outcome, never a `command_rejected`, because the effect was attempted and the attempt is audited; Core classifies git's stderr in one function into nothing_to_commit, non_fast_forward, authentication_required, remote_unreachable, no_upstream, path_outside_repository, or other, and clients never parse output text"
upstream = "a push with set_upstream=false on a branch with no upstream is refused as `failed { no_upstream }` rather than run, because `git push <remote> <branch>` would create an untracked remote branch after which ahead/behind is unknowable and the source chip would read `in sync` forever"
bounds = "git output is bounded to 8192 bytes with a `truncated` flag; a commit message is required, non-empty, and at most 4096 bytes"
exclusions = "pull, merge, and rebase move HEAD and can create conflicts that belong to the lane conflict machinery; commit --amend, reset, force push, and branch delete rewrite history with no affordance in the registered DiffReview and no undo story; switch and checkout would invalidate a bound lane's owner binding, which Core owns through the starter lane path; stash is not in the design"
state = "the finished event is a settled answer to one command and is never folded into `RuntimeViewState`; the `workspace_source_updated` that follows it carries the resampled source and is reduced as it always was"

[runtime_conflict_content]
events = ["merge_conflict_bounced", "lane_conflict_detected"]
attach_sites = "a `ConflictBounce` raised by a failed `merge_agent_patch`, and the `LaneConflictDetected` a refused `apply_lane_changes` publishes, which the reducer copies onto `LaneConflictView`; no new event type exists, both existing events gained one optional field, and a payload written before this capability deserializes to `None` rather than failing the stream"
producer = "one function in `viden_tools::patch` re-runs the same strict apply read-only after it refused, so the reason a client renders is the reason the apply saw; `theirs` is the incoming hunk's new side at its `new_start`, `base` is that hunk's own preimage, and `ours` is a read-only read of the target at the hunk's declared old range, clamped to the file"
baseline = "`Evidence { bindings }` whenever the merge gate holds canonical reviewed evidence, because that is what the reviewer accepted and what the apply was authorised against; `Revision { sha }` for the Lane apply path and for a gate whose bindings no longer validate, naming the commit the `ours` side was read at; `Unknown` when Core held no baseline it could name, which is a real answer a client must render as unknown rather than silently as HEAD"
not_a_merge = "this is two sides plus the patch preimage and nothing else — Core computes no merge base and resolves nothing, so a client must not present it as a three-way merge or offer to auto-resolve it"
honesty = "only hunks the apply actually rejected are listed; a hunk after the refusal was never attempted, a patch the scanner could not parse and a refusal with no hunk shape produce no content at all, and an operator `bounce_merge_conflict` carries `None` because a human judgement has no apply failure behind it — `None` means Core has nothing to show, never that the conflict was empty"
reasons = "context_mismatch, already_applied when the file already holds the hunk's new side, file_missing, file_deleted when a deletion's preimage would leave the file behind, and binary, which the local apply cannot produce because a binary file carries no rows to reject"
bounds = "256 KiB across the published lines; a file over the bound keeps its entry with `omitted` set and no hunks, and the content sets `truncated`, so `not shown` stays distinguishable from `no conflict here`"

[runtime_evidence_reads]
commands = ["query_evidence", "read_evidence_content"]
events = ["evidence_page_loaded", "evidence_content_loaded"]
source = "the durable evidence archive Core rebuilds at open from the append-only workflow agent log (`runtime_projection` / `runtime_projection_batch` rows carrying `evidence_recorded`), never `RuntimeViewState.latest_evidence`, which is a client-side reduction of whatever stream that client received and carries no ordering, no cursor, and no content"
ordering = "ascending on `(timestamp, id)` where timestamp is `EvidenceView.timestamp`; a row Core never dated sorts first, before every dated row, because undated is the oldest thing Core can honestly say about it and a forward-paging client must meet it once at the start rather than after rows it already rendered as newer"
cursor = "opaque: `next_after` is a string a client passes back verbatim as `after`, and clients must not parse, construct, or compare it; it is tagged so the undated position stays distinct from `timestamp = 0`, and an id containing the separator still round-trips"
scope = "`owner` is a prefix scope match over `RuntimeOwner` that fails closed on both sides — a query naming a task is not satisfied by a row that only knows its lane, and a row with no recorded owner never satisfies a scoped read, because answering one with it would turn `Core did not know` into `this lane produced it`; empty `kinds` means every kind, never nothing"
filtering = "every filter is applied before the page is cut, so `complete` and `next_after` describe the filtered archive; a client filtering a page it already holds cannot see a matching row on a page it never loaded, so its `no patch evidence for this lane` would be a completeness claim it has no evidence for"
gate = "the same posture as `query_audit` and deliberately not `query_workspace_files`: bounded and owner-scoped, never tool-gated, because the evidence archive is Viden's own state rather than the operator's tree — there is no workspace read to authorize and no `git_*` or file tool whose viden.toml rule would describe one, so gating it on a tool spec would invent a permission with no meaning and let a rule written about the filesystem hide facts Core already holds; it mutates nothing and prompts for nothing, so it stays answerable in plan mode"
content = "read only from the canonical ContextStore bytes named by `EvidenceView.canonical` and only after they verify against that reference's `source_hash`; no canonical reference answers `unavailable { summary_only }`, an unopenable store or a missing blob or handle answers `unavailable { missing_canonical_bytes }`, bytes that fail their own hash answer `unavailable { hash_mismatch }` and are never served, verified non-UTF-8 bytes answer `unavailable { binary }`, kind `patch` answers `diff` through the same `parse_diff_document` the structured diff capability uses, and everything else answers bounded `text`"
never_unverified = "there is no variant for bytes Core could not verify — content that fails its own hash is exactly the content a reviewer must not be shown as canonical, and `hash_mismatch` is kept apart from every other store failure because it is the opposite fact: the bytes are present and are the wrong ones"
refusals = "an over-limit `kinds` list, a cursor this build did not issue, and an evidence id never recorded are pre-answer refusals published as `command_rejected` carrying the caller's own command id, never an empty page a client would render as an empty archive; `limit` is clamped to 1..=200 rather than refused, as `audit_query` does, because a client that asked for too many rows still means something answerable"
bounds = "50 rows per page by default and at most 200, at most 32 `kinds` filters, and 256 KiB of content with `truncated` on the text path and the document's own `truncated` on the diff path"
state = "both answers are query results and neither is folded into `RuntimeViewState`; the view already carries `latest_evidence`, so folding an archive page in would let a paged read of old rows overwrite the live projection with no way for a client to tell the two apart"
