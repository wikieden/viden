# The 0.3.3 contract increment's four extension fixtures. `payload_sha256` is
# sha256 over the fixture file's exact bytes; `view_sha256` is the fixture's own
# `expected_view_sha256`, which the replay test recomputes from the reduced
# view. Both are recomputed by `frontend_contract_v1.rs` against this file
# rather than compared to a literal, because a literal only has to be edited by
